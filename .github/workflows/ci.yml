name: CI and Pages

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  privacy:
    name: Require GitHub noreply commit emails
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out full reachable history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify author and committer email privacy
        run: ./scripts/verify-commit-email-privacy.sh --all

  verify:
    name: Verify on ${{ matrix.os }} with .NET 10
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true
      CSHARP_DESIGN_PATTERNS_REPOSITORY_BLOB_BASE: https://github.com/${{ github.repository }}/blob/${{ github.sha }}/

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore locked dependencies
        run: dotnet restore DesignPatterns.sln --locked-mode

      - name: Verify formatting
        if: runner.os == 'Windows'
        run: dotnet format DesignPatterns.sln --verify-no-changes --no-restore

      - name: Build solution
        run: dotnet build DesignPatterns.sln --configuration Release --no-restore

      - name: Run standard tests with coverage
        shell: pwsh
        run: >-
          dotnet test DesignPatterns.sln
          --configuration Release
          --no-build
          --no-restore
          --logger "trx;LogFilePrefix=$($env:RUNNER_OS)-"
          --results-directory output/test-results
          --collect "XPlat Code Coverage"

      - name: Run executable teaching checks
        shell: pwsh
        run: |
          dotnet run --project tests/DesignPatterns.SmokeTests --configuration Release --no-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/run-teaching-projects.ps1 -SelfTest -NoBuild

      - name: Test coverage verifier
        shell: pwsh
        run: ./tests/Scripts/verify-coverage.self-test.ps1

      - name: Verify coverage baseline
        shell: pwsh
        run: ./scripts/verify-coverage.ps1 -ResultsDirectory output/test-results

      - name: Verify documentation links and generated pattern index
        shell: pwsh
        run: ./scripts/verify-docs.ps1 -NoBuild

      - name: Render HTML guide previews
        shell: pwsh
        run: ./scripts/export-all-guides.ps1 -HtmlOnly -NoBuild

      - name: Upload test and coverage results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ runner.os }}
          path: output/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload HTML guide previews
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: guide-html-previews
          path: output/pdf/*.html
          if-no-files-found: error
          retention-days: 14

  site:
    name: Verify learning site
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true
      CSHARP_DESIGN_PATTERNS_REPOSITORY_BLOB_BASE: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/
      CSHARP_DESIGN_PATTERNS_PAGES_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Restore locked dependencies
        run: dotnet restore DesignPatterns.sln --locked-mode

      - name: Build solution for the site generators
        run: dotnet build DesignPatterns.sln --configuration Release --no-restore

      - name: Validate learning catalog schema and references
        shell: pwsh
        run: ./scripts/test-learning-catalog.ps1 -NoBuild

      - name: Self-test the learning catalog validator
        shell: pwsh
        run: ./tests/Scripts/learning-catalog.self-test.ps1

      - name: Build and validate the static learning site
        shell: pwsh
        run: ./scripts/build-pages.ps1 -NoBuild

      - name: Verify the staged Pages artifact independently
        shell: pwsh
        run: >-
          ./scripts/verify-pages-site.ps1
          -SiteDirectory output/pages-site
          -ExpectedPagesBase "$env:CSHARP_DESIGN_PATTERNS_PAGES_BASE"

      - name: Self-test the Pages artifact verifier
        shell: pwsh
        run: ./tests/Scripts/pages-site-verifier.self-test.ps1 -SiteDirectory output/pages-site

      - name: Install browser regression dependencies
        run: npm ci --ignore-scripts

      - name: Show system Chrome version
        run: google-chrome --version

      - name: Run real-browser and accessibility regression
        run: npm run test:site

      - name: Upload browser failure screenshot
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-regression-failure
          path: output/site-regression/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload the verified GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: output/pages-site

  deploy:
    name: Deploy verified learning site
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [privacy, verify, site]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out deployment smoke test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Verify the deployed revision and critical resources
        shell: pwsh
        run: >-
          ./scripts/test-pages-deployment.ps1
          -BaseUrl "${{ steps.deployment.outputs.page_url }}"
          -ExpectedRevision "${{ github.sha }}"
