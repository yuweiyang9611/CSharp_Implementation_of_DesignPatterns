name: Commit email privacy

on:
  push:
  pull_request:

concurrency:
  group: email-privacy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Require GitHub noreply commit emails
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out full reachable history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify author and committer email privacy
        run: ./scripts/verify-commit-email-privacy.sh --all
