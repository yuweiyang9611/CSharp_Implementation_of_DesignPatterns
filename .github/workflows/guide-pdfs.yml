name: Guide PDFs

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: guide-pdfs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-guides:
    name: Build verified PDF course pack
    runs-on: windows-latest
    timeout-minutes: 25

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true
      CSHARP_DESIGN_PATTERNS_REPOSITORY_BLOB_BASE: https://github.com/${{ github.repository }}/blob/${{ github.sha }}/

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore locked dependencies
        run: dotnet restore DesignPatterns.sln --locked-mode

      - name: Build solution
        run: dotnet build DesignPatterns.sln --configuration Release --no-restore

      - name: Verify documentation
        shell: pwsh
        run: ./scripts/verify-docs.ps1 -NoBuild

      - name: Generate PDF and HTML course pack
        shell: pwsh
        run: ./scripts/export-all-guides.ps1 -NoBuild

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem output/pdf -File |
            Where-Object Name -ne 'SHA256SUMS.txt' |
            Sort-Object Name |
            ForEach-Object {
              "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
            } | Set-Content output/pdf/SHA256SUMS.txt -Encoding utf8

      - name: Upload PDF course pack
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: csharp-design-patterns-course-pack
          path: output/pdf/
          if-no-files-found: error
          retention-days: 30
