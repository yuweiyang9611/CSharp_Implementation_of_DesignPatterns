version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      dotnet-test-tooling:
        patterns:
          - xunit*
          - Microsoft.NET.Test.Sdk
          - coverlet.collector
      reliable-checkout-infrastructure:
        patterns:
          - Microsoft.Data.Sqlite
          - Microsoft.AspNetCore.Mvc.Testing
          - SQLitePCLRaw.*

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
